# Post Metrics Sync: once a day, the app pulls the numbers of every post published in the last 14 days (YouTube,
# Instagram, Facebook), scores them, and lets the pattern analyst update the Showrunner Playbook. The work runs in the
# app (POST /api/insights/sync-metrics); this job only triggers it. Uses the same ONE repository secret as the render
# worker: RENDER_TOKEN. Also runnable by hand (Actions → Metrics sync → Run workflow).
name: Metrics sync

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: metrics-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://contentmaker-lime.vercel.app
      RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
    steps:
      - name: Sync post metrics
        run: |
          [[ -n "$RENDER_TOKEN" ]] || { echo "Add the RENDER_TOKEN repository secret"; exit 1; }
          curl -sS --fail-with-body --retry 3 --retry-delay 20 --retry-all-errors --max-time 320 \
            -X POST "$APP_URL/api/insights/sync-metrics" -H "Authorization: Bearer $RENDER_TOKEN" | tee result.json
          echo
          node -e 'const r=require("./result.json"); console.log(`synced ${r.synced}, failed ${r.failed}`); for (const n of r.notices||[]) console.log(`notice: ${n}`); if (r.analysis) console.log(r.analysis); for (const p of r.posts||[]) if (p.error) console.log(`::warning::${p.platform} "${p.title}": ${p.error}`)'
